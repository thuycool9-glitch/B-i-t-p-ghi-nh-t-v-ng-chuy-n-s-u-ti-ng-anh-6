<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOCABULARY MEMORY MASTER – ENGLISH 6</title>
<style>
:root{--ink:#14323a;--teal:#1b998b;--teal2:#d9f2ee;--sun:#ffc43d;--coral:#ef476f;--ok:#2e9e5b;--okbg:#dff5e6;--badbg:#fde4e4;--paper:#fffaf0;--card:#fff;--line:#e4dcc8}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.45}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
header b{flex:1;font-size:15px;letter-spacing:.3px}
header button{background:transparent;border:2px solid #ffffff55;color:#fff;border-radius:10px;padding:4px 10px;font-size:16px;cursor:pointer}
main{max-width:780px;margin:0 auto;padding:16px}
h1,h2,h3{margin:.3em 0}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 18px;font:inherit;font-weight:700;font-size:18px;cursor:pointer;background:var(--teal);color:#fff;box-shadow:0 4px 0 #0f6e64;margin:10px 0;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0f6e64}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #c8981a}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 #b02a4c}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:15px;margin:4px 4px 4px 0}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.grid .btn{margin:0}
.tiles{display:flex;justify-content:center;gap:6px;margin:14px 0 6px;flex-wrap:wrap}
.tile{width:46px;height:56px;border-radius:12px;background:var(--sun);display:grid;place-items:center;font-size:30px;font-weight:800;box-shadow:0 4px 0 #c8981a}
.tile.blank{background:#fff;border:3px dashed var(--teal);box-shadow:none;color:var(--teal)}
.tile.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.3) rotate(-6deg)}}
.sub{text-align:center;color:#4b6870;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff}
.hud{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px;flex-wrap:wrap}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;background:var(--teal);transition:width .3s}
.q{text-align:center}
.q .p{color:#4b6870;margin:0 0 6px}
.q .big{font-size:30px;font-weight:800;margin:6px 0 10px;overflow-wrap:anywhere}
.q .big.em{font-size:84px;line-height:1.1}
.q .big.sm{font-size:21px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}.tile{width:38px;height:48px;font-size:25px}}
.opt{border:3px solid var(--line);background:#fff;border-radius:16px;padding:14px 10px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}
.opt:hover:enabled{border-color:var(--teal)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--badbg);border-color:var(--coral);animation:shake .35s}
.opt.off{opacity:.35}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pat{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.pat span{min-width:28px;height:38px;border-radius:8px;background:var(--teal2);display:grid;place-items:center;font-weight:800;font-size:22px}
.pat span.bl{background:#fff;border:2px dashed var(--teal)}
.pat span.gap{background:none;min-width:14px}
input.t{font:inherit;font-size:22px;font-weight:700;text-align:center;border:3px solid var(--line);border-radius:14px;padding:10px;width:min(100%,360px)}
.ans{min-height:56px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;border-bottom:3px dashed var(--line);padding:6px;margin:10px 0}
.fb{border-radius:16px;padding:12px 14px;margin:12px 0;text-align:left;display:none}
.fb.ok{display:block;background:var(--okbg);border:2px solid var(--ok)}
.fb.no{display:block;background:var(--badbg);border:2px solid var(--coral)}
.fb h3{margin:0 0 4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .opt{padding:10px 6px;font-size:16px}
.opt.sel{border-color:var(--sun);background:#fff3cf}
.opt.done{background:var(--okbg);border-color:var(--ok);opacity:.7}
.bucket{border:3px dashed var(--teal);border-radius:16px;padding:8px;min-height:90px;margin:8px 0;cursor:pointer}
.bucket h4{margin:0 0 6px;font-size:15px}
.flip{perspective:900px;height:260px;margin:12px 0;cursor:pointer}
.flip>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.f>div{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;border:3px solid var(--ink);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.face.b{transform:rotateY(180deg);background:var(--teal2)}
.nb{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px}
.nb .em{font-size:34px}
.tag{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--line)}
.tag.REM{background:var(--okbg)}.tag.NEED{background:var(--badbg)}.tag.LEARN{background:#fff3cf}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.fx span{position:absolute;top:-30px;font-size:26px;animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;text-align:center}
.stat div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px}
.stat b{display:block;font-size:26px}
</style>
</head>

const TY={mc:['en2vi','vi2en','def2w'],pic:['pic'],match:['match'],spell:['spell'],fill:['fill'],listen:['listen'],guess:['guess'],odd:['odd'],cls:['cls'],speed:['en2vi','vi2en','def2w'],review:['en2vi','vi2en','def2w','spell','fill','guess','listen'],test:['en2vi','vi2en','def2w','pic','spell','fill','listen','guess','odd','match','cls']};

if(t==='pic'&&!EM[K(w)])t='en2vi';
{const g=gg(p),n3=Object.values(g).filter(a=>a.length>=3).length;if((t==='odd'&&(Object.keys(g).length<2||!n3))||(t==='cls'&&n3<2))t='def2w'}

if(t==='vi2en')return{k:'mc',t,w,p:'Chọn từ tiếng Anh đúng với nghĩa:',big:w.m,o:O(dist(w,p,x=>x.w),x=>x.w),a:w.w};
if(t==='def2w')return{k:'mc',t,w,p:'Chọn từ phù hợp với định nghĩa:',big:w.d,sm:1,o:O(dist(w,p,x=>x.w),x=>x.w),a:w.w,hintTxt:'Nghĩa: '+w.m};
if(t==='pic'){const e=V.filter(x=>EM[K(x)]&&K(x)!==K(w));const d=[];for(const x of SH(e)){if(x.m!==w.m&&!d.some(y=>K(y)===K(x)))d.push(x);if(d.length===3)break}return{k:'mc',t,w,p:'Nhìn hình và chọn từ tiếng Anh:',big:EM[K(w)],em:1,o:SH([w,...d]).map(x=>x.w),a:w.w,hintTxt:'Nghĩa: '+w.m}}
if(t==='listen'){const q={k:'mc',t,w,p:TTS?'Nghe và chọn từ đúng:':'Trình duyệt không hỗ trợ phát âm – chọn từ theo nghĩa:',big:TTS?'🎧':w.m,say:TTS?w.w:null,o:O(dist(w,p,x=>x.w),x=>x.w),a:w.w,hintTxt:'Nghĩa: '+w.m};return q}
if(t==='spell')return{k:'build',t,w,p:'Sắp xếp các chữ cái thành từ đúng:',big:w.m,hintTxt:'Chữ đầu tiên: '+w.w[0].toUpperCase()};
if(t==='fill')return{k:'input',t,w,p:'Điền đầy đủ từ còn thiếu chữ:',pat:w.p,big:w.d,sm:1,hintTxt:'Nghĩa: '+w.m+' · chữ đầu: '+w.w[0]};
if(t==='guess')return{k:'input',t,w,p:'Đoán từ tiếng Anh:',big:w.m,pat:w.w.replace(/[A-Za-z]/g,'_'),hintTxt:'Gợi ý: '+w.d+' · chữ đầu: '+w.w[0]};
if(t==='odd'){const g=gg(p),us=Object.keys(g).filter(u=>g[u].length>=3),ua=R(us),ub=R(Object.keys(g).filter(u=>u!=ua)),three=SH(g[ua]).slice(0,3),odd=R(g[ub]);return{k:'mc',t,w:odd,p:'Ba từ cùng một Unit. Tìm từ KHÁC Unit:',big:'?',o:SH([...three,odd]).map(x=>x.w),a:odd.w,ex:`Ba từ kia thuộc Unit ${ua} (${UT[ua]}); <b>${odd.w}</b> thuộc Unit ${ub} (${UT[ub]}).`,more:three,hintTxt:'Unit của từ khác: '+ub}}
if(t==='match'){const ws=picks(p,5);return{k:'match',t,w:ws[0],ws,p:'Nối mỗi từ với nghĩa tiếng Việt:',L:SH(ws),Rr:SH(ws)}}
if(t==='cls'){const g=gg(p),us=SH(Object.keys(g).filter(u=>g[u].length>=3)).slice(0,2),ws=[];us.forEach(u=>SH(g[u]).slice(0,3).forEach(x=>ws.push(x)));return{k:'cls',t,w:ws[0],ws:SH(ws),us,p:'Xếp mỗi từ vào đúng Unit:'}}}
function build(mode,n){let p=pool(),t=TY[mode];if(mode==='review'){const r=p.filter(w=>['NEED','LEARN'].includes(status(w)));if(r.length>=5)p=r}
const all=pool();if(mode==='pic'){let e=p.filter(w=>EM[K(w)]);if(e.length<3){const s=new Set();e=V.filter(w=>EM[K(w)]&&!s.has(K(w))&&s.add(K(w)))}p=e}
const ws=picks(p,Math.min(n,p.length)),qs=[];ws.forEach((w,i)=>{qs.push(mk(mode==='test'||mode==='review'?R(t):t[i%t.length],w,all))});return qs.filter(Boolean)}

/* ---------- quiz flow ---------- */
function start(mode){stop();
if(mode==='cards'||mode==='learn'){let d=pool();if(mode==='learn'){const n=d.filter(w=>status(w)==='NEW');if(n.length)d=n}return cards(SH(d).slice(0,20))}
const n=mode==='speed'?60:mode==='test'?30:10;let qs=build(mode,n);
if(mode==='speed'){const p=pool();while(qs.length<60)qs.push(mk(R(TY.speed),R(p),p))}
G={mode,qs,i:0,score:0,streak:0,ok:0,no:0,log:[],t0:Date.now(),req:{},total:60};save();next(true)}
function next(first){if(!first)G.i++;if(G.i>=G.qs.length||(G.mode==='speed'&&G.total<=0))return end();render()}
function limit(q){return G.mode==='speed'?Math.max(4,8-Math.floor(G.ok/3)):(q.k==='match'||q.k==='cls')?90:30}
function render(){stop();const q=G.q=G.qs[G.i];G.locked=0;G.hint=0;G.tl=limit(q);G.mist=0;G.sel=null;G.done=0;G.ans=[];G.pl={};

build:()=>{const L=SH([...q.w.w.replace(/[ -]/g,'')].map((c,i)=>({c,i})));q.tl=L;if(L.map(x=>x.c).join('')===q.w.w.replace(/[ -]/g,'')&&L.length>2)L.reverse();return`<p class="sub">${lenTxt(q.w)}</p><div class="ans" id="ans"></div><div class="tiles" id="tp">${L.map((x,i)=>`<button class="tile" data-i="${i}" onclick="tap(${i})" style="border:0;cursor:pointer;font-family:inherit">${x.c.toUpperCase()}</button>`).join('')}</div><button class="btn sm ghost" onclick="clr()">↺ Làm lại</button>`},
match:()=>`<div class="pair"><div>${q.L.map(x=>`<button class="opt" data-l="${x.w}" onclick="mpick('L','${x.w.replace(/'/g,"\\'")}')">${x.w}</button>`).join('')}</div><div>${q.Rr.map(x=>`<button class="opt" data-r="${x.w}" onclick="mpick('R','${x.w.replace(/'/g,"\\'")}')">${x.m}</button>`).join('')}</div></div>`,
cls:()=>`<div class="chips" id="cw">${q.ws.map((x,i)=>`<button class="chip" data-i="${i}" onclick="event.stopPropagation();cpick(${i})">${x.w}</button>`).join('')}</div>${q.us.map(u=>`<div class="bucket" onclick="cput('${u}')"><h4>Unit ${u}: ${UT[u]}</h4><div class="chips" id="b${u}"></div></div>`).join('')}<button class="btn sm" onclick="cchk()">CHECK</button>`}[q.k]();
app(`<div class="hud"><span>Câu ${G.i+1}/${G.qs.length}${G.mode==='speed'?'':''}</span><span>⭐ ${G.score}</span><span id="tm">⏱ ${G.tl}s${G.mode==='speed'?' · tổng '+G.total+'s':''}</span></div>
<div class="bar"><i style="width:${G.i/G.qs.length*100}%"></i></div>
<div class="card q"><p class="p">${q.req?'🔁 Ôn lại · ':''}${q.p}</p>${q.big?`<div class="big ${q.em?'em':''} ${q.sm?'sm':''}">${q.big}</div>`:''}${q.say?`<button class="btn sm sun" onclick="say(G.q.say)">🔊 Nghe</button>${q.t==='listen'?`<label style="font-size:14px">Tốc độ <input type="range" min=".5" max="1.2" step=".1" value="${S.rate}" onchange="S.rate=+this.value;save();say(G.q.say)"></label>`:''}`:''}${body}
<div id="fb" class="fb"></div><div><button class="btn sm ghost" id="hb" onclick="hint()">💡 Gợi ý (+5)</button> <button class="btn sm sun" id="nx" style="display:none" onclick="next()">NEXT ➜</button></div></div>`);
if(q.t==='listen'&&TTS)setTimeout(()=>say(q.say),300);
if(q.k==='input')setTimeout(()=>{const e=$('#in');e&&e.focus()},50);
timer=setInterval(()=>{G.tl--;if(G.mode==='speed')G.total--;const t=$('#tm');if(t)t.textContent='⏱ '+Math.max(G.tl,0)+'s'+(G.mode==='speed'?' · tổng '+Math.max(G.total,0)+'s':'');if(G.mode==='speed'&&G.total<=0&&!G.locked){return finish(false,'Hết giờ!')}if(G.tl<=0&&!G.locked)finish(false,'Hết giờ!')},1000)}
function hint(){const q=G.q;if(G.locked||G.hint)return;G.hint=1;$('#hb').disabled=true;
if(q.k==='mc'){let n=0;document.querySelectorAll('.opt').forEach(b=>{if(q.o[b.dataset.i]!==q.a&&n<2){b.disabled=true;b.classList.add('off');n++}})}
const f=$('#fb');f.className='fb';f.style.display='block';f.style.background='#fff3cf';f.style.border='2px solid var(--sun)';f.innerHTML='💡 '+(q.hintTxt||(q.k==='mc'?'Đã loại bớt 2 đáp án sai.':'Hãy xem lại kỹ các cặp từ.'));if(q.k==='mc'&&q.hintTxt)f.innerHTML+=' (đã loại bớt 2 đáp án sai)'}
function pick(i){if(G.locked)return;const q=G.q,ok=q.o[i]===q.a;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(q.o[b.dataset.i]===q.a)b.classList.add('ok');else if(+b.dataset.i===i)b.classList.add('no')});finish(ok)}
function chk(){if(G.locked)return;const q=G.q,v=norm($('#in').value);if(!v)return;finish(v===norm(q.w.w)||(q.w.w==='program'&&v==='programme'))}
function tap(i){if(G.locked||G.pl[i])return;G.pl[i]=1;G.ans.push(i);const b=document.querySelector(`#tp [data-i="${i}"]`);b.style.visibility='hidden';drawAns();if(G.ans.length===G.q.tl.length){const s=G.ans.map(j=>G.q.tl[j].c).join('');finish(s===norm(G.q.w.w)||(G.q.w.w==='program'&&s==='programme'))}}

function clr(){if(G.locked)return;G.ans=[];G.pl={};document.querySelectorAll('#tp .tile').forEach(b=>b.style.visibility='visible');drawAns()}
function mpick(side,w){if(G.locked)return;const q=G.q;if(G.done>=0&&G.pl[w])return;
if(side==='L'){G.sel=w;document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('sel',b.dataset.l===w&&!G.pl[w]));return}
if(!G.sel)return;const ok=G.sel===w;
if(ok){G.pl[w]=1;G.done++;document.querySelectorAll(`[data-l="${w.replace(/"/g,'')}"],[data-r="${w.replace(/"/g,'')}"]`).forEach(b=>{b.classList.remove('sel');b.classList.add('done')});G.sel=null;if(G.done===q.ws.length)finish(G.mist<=2,'',true)}
else{G.mist++;G.bad=G.bad||{};G.bad[G.sel]=1;const b=document.querySelector(`[data-r="${w}"]`);b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400)}}
function cpick(i){if(G.locked)return;G.sel=i;document.querySelectorAll('#cw .chip').forEach(b=>b.classList.toggle('on',+b.dataset.i===i))}
function cput(u){if(G.locked||G.sel===null)return;const x=G.q.ws[G.sel];G.pl[G.sel]=u;const c=document.querySelector(`#cw [data-i="${G.sel}"]`);c.classList.remove('on');$('#b'+u).appendChild(c);G.sel=null}
function cchk(){if(G.locked)return;const q=G.q;if(Object.keys(G.pl).length<q.ws.length)return;let r=0;q.ws.forEach((x,i)=>{const ok=String(x.u)===String(G.pl[i]);rec(x,'cls',ok);if(ok)r++;const c=document.querySelector(`#cw [data-i="${i}"],#b${G.pl[i]} [data-i="${i}"]`);c&&c.classList.add(ok?'on':'no')});finish(r===q.ws.length,'',true,r)}
function finish(ok,why,multi,part){if(G.locked)return;G.locked=1;clearInterval(timer);const q=G.q;let pts=0,msg='';
if(ok){pts=G.hint?5:10;G.streak++;G.ok++;if(G.streak%5===0){pts+=10;msg=' 🔥 +10 thưởng chuỗi 5 câu đúng!'}}else{G.streak=0;G.no++}
if(q.k==='match'){q.ws.forEach(x=>rec(x,'match',!(G.bad&&G.bad[x.w])));G.bad=null}else if(q.k!=='cls')rec(q.w,q.t,ok);
if(ok&&q.more)q.more.forEach(x=>rec(x,'odd',true));
G.score+=pts;S.tot+=ok?1:0;
G.log.push({u:q.w.u,ok,w:q.w,q});if(!ok&&q.k!=='cls'&&q.k!=='match'&&!G.req[K(q.w)]&&G.mode!=='speed'){G.req[K(q.w)]=1;const alt=mk(R(['en2vi','vi2en','def2w','fill']),q.w,pool());if(alt){alt.req=1;G.qs.push(alt)}}
beep(ok);const f=$('#fb');f.removeAttribute('style');
const ans=q.k==='match'?q.ws.map(x=>x.w+' = '+x.m).join('<br>'):q.k==='cls'?q.ws.map(x=>x.w+' → Unit '+x.u).join('<br>'):info(q.w);
f.className='fb '+(ok?'ok':'no');f.innerHTML=ok?`<h3>✔ EXCELLENT! CORRECT ANSWER!</h3>+${pts} điểm${msg}<br>${ans}${q.ex?'<br>'+q.ex:''}`:`<h3>✖ ${why||'NOT QUITE! TRY AGAIN!'}</h3>${q.k==='cls'?`Đúng ${part}/${q.ws.length} từ.<br>`:''}Đáp án:<br>${ans}${q.ex?'<br>'+q.ex:''}`;
if(q.k==='input')$('#in').disabled=true;
if(ok){confetti();q.say&&0}
if(q.k==='build'){const s=q.w.w;$('#ans').innerHTML=[...s].map(c=>c===' '||c==='-'?`<span style="width:14px"></span>`:`<span class="tile">${c.toUpperCase()}</span>`).join('')}
$('#hb').style.display='none';const nx=$('#nx');nx.style.display='inline-block';$('#sc').textContent='⭐ '+G.score;
if(G.mode==='speed'){if(G.total<=0)setTimeout(end,900);else{setTimeout(()=>{if(G.q===q)next()},ok?700:1600);G.timerSpeed=1;timer=setInterval(()=>{G.total--;if(G.total<=0){clearInterval(timer);end()}},1000)}}
save()}
function end(){stop();const n=G.log.length,ok=G.log.filter(x=>x.ok).length,acc=n?Math.round(ok/n*100):0,time=G.time=G.time||Math.round((Date.now()-G.t0)/1000);
const c=counts();
if(!G.fin){G.fin=1;G.nb=[];S.rounds++;const aw=(b,c)=>{if(c&&!S.badges[b]){S.badges[b]=1;G.nb.push(b)}};aw('Vocabulary Beginner',1);aw('Word Explorer',S.tot>=50);aw('Memory Expert',c.REM>=25);aw('Vocabulary Master',c.REM>=100);aw('English Champion',G.mode==='test'&&acc>=90);save()}const nb=G.nb;
const gr=acc>=90?'EXCELLENT!':acc>=80?'VERY GOOD!':acc>=65?'GOOD!':acc>=50?'KEEP PRACTISING!':'TRY AGAIN!';
const bu={};G.log.forEach(x=>{(bu[x.u]=bu[x.u]||[0,0])[x.ok?0:1]++});
const wrong=G.log.filter(x=>!x.ok);
$('#sc').textContent='';
app(`<div class="card q"><h1>${gr}</h1><div class="big" style="color:var(--teal)">⭐ ${G.score}</div>${nb.length?`<p>🎖️ Huy hiệu mới: <b>${nb.join(', ')}</b></p>`:''}
<div class="stat"><div><b>${n}</b>Tổng số câu</div><div><b>${ok}</b>Đúng</div><div><b>${n-ok}</b>Sai</div><div><b>${acc}%</b>Chính xác</div><div><b>${Math.floor(time/60)}:${String(time%60).padStart(2,'0')}</b>Thời gian</div><div><b>${c.REM}</b>Từ REMEMBERED</div><div><b>${c.NEED}</b>Từ cần ôn thêm</div></div>
<p style="text-align:left"><b>Kết quả theo Unit:</b><br>${Object.keys(bu).map(u=>`Unit ${u} – ${UT[u]}: ${bu[u][0]}/${bu[u][0]+bu[u][1]} đúng`).join('<br>')||'—'}</p></div>
<button class="btn sun" onclick="revm()">REVIEW MISTAKES (${wrong.length})</button><button class="btn" onclick="start('${G.mode}')">PRACTISE AGAIN</button><button class="btn" onclick="notebook('NEED')">LEARN AGAIN</button><button class="btn ghost" onclick="home()">BACK TO HOME</button>`);if(acc>=65)confetti()}
function revm(){const w=G.log.filter(x=>!x.ok);app(`<h2>Các câu sai</h2>${w.length?w.map(x=>`<div class="card">${x.q.k==='match'||x.q.k==='cls'?x.q.ws.map(info).join('<hr>'):info(x.w)}</div>`).join(''):'<div class="card">Không có câu sai. Tuyệt vời!</div>'}<button class="btn" onclick="end()">⬅ Quay lại kết quả</button>`)}

/* ---------- cards & notebook ---------- */
function cards(d){if(!d.length)return modes();let i=0,tot=d.length;const show=()=>{if(i>=tot){return modes()}const w=d[i],e=EM[K(w)];app(`<div class="hud"><span>Thẻ ${i+1}/${tot}</span><span>${SL[status(w)]}</span></div><div class="bar"><i style="width:${i/tot*100}%"></i></div>
<div class="flip" id="fl" onclick="this.classList.toggle('f')"><div><div class="face">${e?`<div class="big em" style="font-size:80px">${e}</div>`:''}<div style="font-size:34px;font-weight:800">${w.w}</div><small>Chạm để lật thẻ</small></div><div class="face b"><div style="font-size:28px;font-weight:800">${w.m}</div><p>${w.d}</p><small>Unit ${w.u}: ${UT[w.u]}</small></div></div></div>
<button class="btn sm sun" onclick="say('${w.w.replace(/'/g,"\\'")}')">🔊 Nghe</button>
<div class="grid"><button class="btn" id="kn">✔ Đã nhớ</button><button class="btn coral" id="rv">↻ Cần ôn lại</button></div><button class="btn ghost" onclick="modes()">Thoát</button>`);
$('#kn').onclick=()=>{const a=stat(w);a.s++;a.f=0;save();i++;show()};$('#rv').onclick=()=>{const a=stat(w);a.s++;a.f=1;save();i++;show()}};show()}
function notebook(f){stop();f=f||'ALL';const p=pool();const q=(window.__q||'').toLowerCase();
const list=p.filter(w=>(f==='ALL'||status(w)===f)&&(!q||(w.w+w.m).toLowerCase().includes(q)));
app(`<h2>MY VOCABULARY NOTEBOOK</h2><div class="chips">${['ALL','NEW','LEARN','REM','NEED'].map(s=>`<button class="chip ${f===s?'on':''}" onclick="notebook('${s}')">${s==='ALL'?'ALL ('+p.length+')':SL[s]+' ('+p.filter(w=>status(w)===s).length+')'}</button>`).join('')}</div>
<p class="sub" style="text-align:left">Phạm vi: ${S.scope.length===ALLU.length?'tất cả Unit':S.scope.map(u=>'Unit '+u).join(', ')} · <a href="#" onclick="modes();return false">đổi Unit</a></p>
<input class="t" style="width:100%;margin-bottom:8px" placeholder="Tìm từ…" value="${q}" oninput="window.__q=this.value;clearTimeout(window.__t);window.__t=setTimeout(()=>{notebook('${f}');const i=$('.t');i.focus();i.setSelectionRange(99,99)},350)">
${list.map(w=>{const s=status(w),e=EM[K(w)]||'';return`<div class="card nb"><span class="em">${e||'📘'}</span><div><b style="font-size:20px">${w.w}</b> <span class="tag ${s}">${SL[s]}</span><br>${w.m}<br><small>${w.d} · Unit ${w.u}</small></div><div><button class="btn sm sun" onclick="say('${w.w.replace(/'/g,"\\'")}')">🔊</button><button class="btn sm ${stat(w).f?'coral':'ghost'}" onclick="flag('${w.w.replace(/'/g,"\\'")}','${f}')" title="Đánh dấu cần ôn lại">🚩</button></div></div>`}).join('')||'<div class="card">Không có từ nào trong nhóm này.</div>'}
<button class="btn ghost" onclick="home()">BACK TO HOME</button>`)}
function flag(w,f){const x=V.find(v=>v.w===w),a=stat(x);a.f=a.f?0:1;if(!a.s&&a.f)a.s=1;save();notebook(f)}
home();
</script>
</body>
</html>
